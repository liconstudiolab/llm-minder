[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-minder"
version = "1.0.0rc1"
description = "Provider-neutral asyncio toolkit for concurrent LLM calls with retries, scoped RPM/TPM admission, bounded streaming, resumable checkpoints, and deadlines."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Geoff Davis", email = "geoff@keksi.ai"}
]
keywords = [
    "LLM",
    "asyncio",
    "batch-processing",
    "AI",
    "orchestration",
    "pydantic",
    "pydantic-ai",
    "gemini",
    "openai",
    "openrouter",
    "deepseek",
    "anthropic",
    "langchain",
    "parallel",
    "concurrency",
    "rate-limiting",
    "token-quota",
    "retry",
    "streaming",
    "checkpointing",
    "resumable",
    "deadlines",
    "fail-fast",
    "observability",
    "jsonl",
    "structured-output",
    "prompt-engineering"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]

dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.4.0",  # PEP 696 TypeVar defaults on Python < 3.13
]

[project.optional-dependencies]
pydantic-ai = [
    "pydantic-ai>=1.32.0",
]
gemini = [
    "google-genai>=1.49.0",
]
openai = [
    "openai>=1.66.2",
]
openrouter = [
    "openai>=1.66.2",
]
deepseek = [
    "openai>=1.66.2",
]
progress = [
    "tqdm>=4.66",
]
media = [
    "boto3>=1.40.60",
]
all = [
    "pydantic-ai>=1.32.0",
    "google-genai>=1.49.0",
    "openai>=1.66.2",
    "tqdm>=4.66",
    "boto3>=1.40.60",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    # Old page URLs (api/single-gateway/). 1.2.3 adds a properdocs dependency only
    # to print a "switch to ProperDocs" banner; 1.2.2 redirects the same way.
    "mkdocs-redirects>=1.2.0,<1.2.3",
    # pymdown-extensions 12.2 changed Highlight's constructor; mkdocstrings handles it
    # from 1.0.7.
    "mkdocstrings[python]>=1.0.7",
    "pymdown-extensions>=10.0",
    "matplotlib>=3.8",  # generate_benchmark_charts.py (docs/benchmarks.md figures)
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "ty>=0.0.1a16",
    "pydantic-ai>=1.32.0",  # Required for tests
    "google-genai>=1.49.0",  # Required for Gemini tests
    "openai>=1.66.2",  # Required for OpenAI/OpenRouter tests
    "tqdm>=4.66",  # Required for progress=True tests
    "boto3>=1.40.60",  # Required for media client construction tests
    "prek>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/geoff-davis/llm-minder"
Documentation = "https://geoff-davis.github.io/llm-minder/"
Repository = "https://github.com/geoff-davis/llm-minder"
Issues = "https://github.com/geoff-davis/llm-minder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_minder"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
    "/uv.lock",
    "/docs",
    "/examples",
    "/tests",
]
exclude = [
    "/.github",
    "/.claude",
    "/.uv-cache",
    "/.ruff_cache",
    "/.mypy_cache",
    "/.pytest_cache",
    "/htmlcov",
    "/dist",
    "/build",
    "/node_modules",
    "/.venv",
    "/docs/internal",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.uv]
# Lock-only floors for patched releases of transitive development/extra dependencies;
# they don't change the published package metadata.
constraint-dependencies = [
    "authlib>=1.9.1",
    "dnspython>=2.9.0",
    "pillow>=13.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "UP042",  # StrEnum changes str() and format() of the public str enums
]

[tool.ruff.lint.isort]
known-first-party = ["llm_minder"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Allow unused ignores for optional dependencies

[[tool.mypy.overrides]]
module = "llm_minder.llm_strategies"
disable_error_code = ["override", "arg-type", "attr-defined", "assignment"]

[[tool.mypy.overrides]]
module = "llm_minder.base"
disable_error_code = ["assignment"]  # TypedDict default_factory limitation

# numpy arrives only with the docs extra (matplotlib) and is reached through
# tiktoken/openai. numpy >= 2.5 needs Python 3.12 and its stubs use the `type`
# statement, which mypy rejects at python_version 3.11. We never use numpy.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true  # numpy ships .pyi stubs; skip applies to them only with this

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*", "!TestOutput"]  # Ignore TestOutput (Pydantic models)
markers = [
    "slow: marks tests as slow (deselected by default, run with -m slow)",
    "integration: marks tests as integration tests that require API keys (deselected by default)",
    "benchmark: marks tests as performance benchmarks (deselected by default)",
]
addopts = "-m 'not slow and not integration and not benchmark'"  # Skip slow, integration, and benchmark tests by default
# Deadlock/hang regressions fail loudly instead of hanging CI forever.
timeout = 60
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
    # Many test strategies still return the deprecated 2-tuple from execute();
    # tests/test_deprecations.py asserts the warning itself.
    "ignore:.*returned a 2-tuple \\(output, tokens\\):DeprecationWarning",
    # google-genai's own import-time warning on Python 3.14 (not ours); the
    # migration guide documents the same filter for users.
    "ignore::DeprecationWarning:google.genai.types",
]

[tool.coverage.run]
source = ["src/llm_minder"]
omit = [
    "*/tests/*",
    "*/testing/*",
    "*/__pycache__/*",
]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
